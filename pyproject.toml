[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel -- live SLA truth-bonds for the agent/x402 economy, built on GenLayer Intelligent Contracts."
requires-python = ">=3.12"
dependencies = [
    "genlayer-py",
    "genlayer-test",
    "genvm-linter",
    "pytest",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests/direct"]

[tool.setuptools]
# This project has no distributable Python package of its own -- pyproject.toml
# exists only to declare the tooling dependencies CI/local dev installs.
# Without this, setuptools' flat-layout auto-discovery sees contracts/, deploy/,
# frontend/ as candidate top-level packages and refuses to build at all
# ("Multiple top-level packages discovered in a flat-layout"), which is why
# `pip install .` was silently failing on every CI run.
packages = []
